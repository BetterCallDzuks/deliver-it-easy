name: EAS Build

# Builds installable binaries via EAS.
#   • Push a version tag (e.g. v1.0.0) -> production build for Android.
#   • Or trigger manually from the Actions tab to pick platform + profile.
#
# Requires an EXPO_TOKEN repository secret:
#   1. Create an access token at https://expo.dev/settings/access-tokens
#   2. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: EXPO_TOKEN
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build profile
        type: choice
        options: [preview, production]
        default: production

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check EXPO_TOKEN is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in repo Settings -> Secrets -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        run: |
          eas build \
            --non-interactive \
            --no-wait \
            --platform "${{ github.event.inputs.platform || 'android' }}" \
            --profile "${{ github.event.inputs.profile || 'production' }}"
